name: Build & Release Mobile App (APK & Web)

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend API URL (Render)'
        required: true
        default: 'https://weathergpt-backend.onrender.com'
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://weathergpt-backend.onrender.com' }}
        run: |
          flutter build apk --release --dart-define=BACKEND_URL=$BACKEND_URL
          cp build/app/outputs/flutter-apk/app-release.apk ../WeatherGPT-Mobile-v1.0.0.apk || true

      - name: Build Flutter Web (Fallback Zero-Install)
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://weathergpt-backend.onrender.com' }}
        run: |
          flutter build web --release --dart-define=BACKEND_URL=$BACKEND_URL

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: mobile/build/web

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeatherGPT-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: WeatherGPT Mobile ${{ github.event.inputs.tag_name || github.ref_name }} (SIH PS 26068)
          body: |
            ## 📱 WeatherGPT Mobile Client — Direct APK Download
            - **Target Problem Statement**: SIH 26068
            - **Backend Endpoint**: `${{ github.event.inputs.backend_url || 'https://weathergpt-backend.onrender.com' }}`
            - **Architecture**: Flutter + Riverpod + WebSocket Real-Time Alerts
            
            ### Installation
            1. Download `WeatherGPT-Mobile.apk` directly to your Android device.
            2. Enable *Install from Unknown Sources* if prompted.
            3. Open the app to access conversational meteorological intelligence and live disaster alerts.
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
