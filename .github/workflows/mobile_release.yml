name: Build & Release Mobile App (APK & Web)

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend API URL (Render)'
        required: true
        default: 'https://weathergpt-backend-g6ds.onrender.com'
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Keystore & Signing
        run: |
          if [ ! -f "android/app/release-key.jks" ]; then
            echo "Generating release keystore..."
            keytool -genkeypair -v -keystore android/app/release-key.jks -alias weathergpt -keyalg RSA -keysize 2048 -validity 10000 -storepass weathergpt2026 -keypass weathergpt2026 -dname "CN=WeatherGPT, OU=Meteorology, O=HelixMinds, L=Kolkata, ST=WestBengal, C=IN"
            cp android/app/release-key.jks android/release-key.jks
            echo "storePassword=weathergpt2026" > android/key.properties
            echo "keyPassword=weathergpt2026" >> android/key.properties
            echo "keyAlias=weathergpt" >> android/key.properties
            echo "storeFile=release-key.jks" >> android/key.properties
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split APKs (arm64-v8a, armeabi-v7a, x86_64) & Universal APK
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://weathergpt-backend-g6ds.onrender.com' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || '' }}
        run: |
          echo "Building split-per-abi APKs..."
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation --dart-define=BACKEND_URL=$BACKEND_URL --dart-define=SENTRY_DSN=$SENTRY_DSN
          echo "Building universal fallback APK..."
          flutter build apk --release --android-skip-build-dependency-validation --dart-define=BACKEND_URL=$BACKEND_URL --dart-define=SENTRY_DSN=$SENTRY_DSN
          ls -lh build/app/outputs/flutter-apk/

      - name: Build Flutter Web (Fallback Zero-Install)
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://weathergpt-backend-g6ds.onrender.com' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || '' }}
        run: |
          flutter build web --release --dart-define=BACKEND_URL=$BACKEND_URL --dart-define=SENTRY_DSN=$SENTRY_DSN

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: mobile/build/web

      - name: Upload Primary APK Artifact (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: WeatherGPT-Android-arm64-v8a-APK
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeatherGPT-Android-Universal-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with Signed APKs
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: WeatherGPT Mobile ${{ github.event.inputs.tag_name || github.ref_name }} (SIH PS 26068)
          body: |
            ## 📱 WeatherGPT Mobile Client — Direct APK Downloads (Signed Release)
            - **Target Problem Statement**: SIH 26068 (AI Meteorological Intelligence & Disaster Response)
            - **Backend Cloud Endpoint**: `${{ github.event.inputs.backend_url || 'https://weathergpt-backend-g6ds.onrender.com' }}`
            - **Architecture**: Flutter + WebSocket Alerts + Sentry Crash Visibility
            
            ### ⬇️ Download Links
            | Target Architecture | APK Package | Recommended For |
            | :--- | :--- | :--- |
            | **ARM64 (64-bit)** *(Recommended)* | [`app-arm64-v8a-release.apk`](https://github.com/kanka-317/WeatherGPT/releases/download/${{ github.event.inputs.tag_name || github.ref_name }}/app-arm64-v8a-release.apk) | 95%+ of modern Android phones (faster, smaller) |
            | **Universal FAT APK** | [`app-release.apk`](https://github.com/kanka-317/WeatherGPT/releases/download/${{ github.event.inputs.tag_name || github.ref_name }}/app-release.apk) | Any Android device (32-bit & 64-bit combined) |
            | **ARM32 (32-bit)** | [`app-armeabi-v7a-release.apk`](https://github.com/kanka-317/WeatherGPT/releases/download/${{ github.event.inputs.tag_name || github.ref_name }}/app-armeabi-v7a-release.apk) | Older Android devices |
            
            ### 🌐 Zero-Install Mobile Web Fallback
            - **Live Web Client**: [https://weathergpt-mobile.netlify.app](https://weathergpt-mobile.netlify.app)
            
            ### 🛠️ Android Installation Steps
            1. Download `app-arm64-v8a-release.apk` directly to your phone.
            2. Tap the downloaded `.apk` file.
            3. When prompted, tap **"Settings"** and toggle on **"Allow from this source"** (Unknown sources).
            4. Tap **"Install"** and launch **WeatherGPT**.
          files: |
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
